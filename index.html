<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>日本株かんたん分析</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#162033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1080px;margin:auto;padding:16px 10px 70px}.top{padding:18px 4px 10px}.eyebrow{font-size:12px;font-weight:900;color:#08765a}.top h1{font-size:28px;margin:5px 0}.muted{color:#738197;font-size:12px;line-height:1.7}.card{background:#fff;border:1px solid #e5eaf0;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(20,30,50,.04)}.search{display:flex;gap:8px}.search input,.price input{flex:1;min-width:0;border:1px solid #d8e0e9;border-radius:13px;padding:13px;font-size:16px}.btn{border:0;border-radius:13px;padding:12px 16px;background:#0d7c5a;color:#fff;font-weight:900}.btn.alt{background:#edf7f3;color:#08684d}.result{padding:13px;border:1px solid #e2e8f0;border-radius:14px;margin-top:8px}.result b{display:block}.head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}.head h2{font-size:25px;margin:3px 0}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:#e9f8f2;color:#087051;font-size:12px;font-weight:900}.price{background:#142338;color:white;padding:15px;border-radius:18px;min-width:320px}.price .muted{color:#aebbd0}.price-row{display:flex;gap:7px;margin-top:8px}.price .btn{background:#fff;color:#142338;padding:10px}.formula{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.kpi{background:#fff;border:1px solid #e6ebf1;border-radius:17px;padding:13px}.kpi .v{font-weight:900;font-size:18px;margin-top:6px}.price .kpi{background:#192c44;border-color:#29415f;color:#fff}.good{color:#07845c}.mid{color:#a56b00}.bad{color:#c2413b}.na{color:#7b8799}.summary{background:#effaf6;border-color:#bcebd9}.summary h3{margin:4px 0 7px}.section-title{font-size:19px;margin:0 0 4px}.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.chart{border:1px solid #e5eaf0;border-radius:16px;padding:13px;overflow:hidden}.chart h4{margin:0 0 5px;font-size:14px}.chart svg{width:100%;height:175px;display:block}.comment{background:#f7f9fc;border-radius:11px;padding:10px;font-size:12px;line-height:1.65;color:#56677b}.comment b{color:#162033}.group{margin-top:20px}.group-label{font-size:12px;font-weight:900;color:#07845c;margin-bottom:8px}.analysis-row{display:grid;grid-template-columns:34px 1fr;gap:12px;border-top:1px solid #eef2f5;padding:17px 0}.n{width:31px;height:31px;border-radius:50%;background:#142338;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}.analysis-row h4{margin:0 0 7px}.status{font-weight:900;margin:5px 0}.help{background:#f7f9fc;border-radius:11px;padding:10px;font-size:12px;line-height:1.7;color:#526278}.detail{font-size:12px;color:#6c7b8e;line-height:1.7;margin:7px 0}.source{font-size:12px;color:#64748b;line-height:1.7}.loading{padding:20px;text-align:center;color:#64748b}.error{background:#fff3f2;border-color:#fecaca;color:#9f2d2a}.hidden{display:none}@media(max-width:780px){.head{display:block}.price{min-width:0;margin-top:12px}.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.formula{grid-template-columns:1fr 1fr}.top h1{font-size:25px}.card{border-radius:18px;padding:15px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="eyebrow">個人用・EDINET DB連携</div><h1>日本株かんたん分析</h1><div class="muted">証券コードや会社名を入れるだけ。数字 → 意味 → 良い悪い → 投資でどう見るか、までまとめます。</div></header>

<section class="card">
  <form class="search" id="searchForm"><input id="q" placeholder="例：8306 / 三菱UFJ / 4516"><button class="btn">分析する</button></form>
  <div id="apiStatus" class="muted" style="margin-top:8px">API接続を確認中…</div>
  <div id="results"></div>
</section>
<div id="errorBox" class="card error hidden"></div>
<div id="loading" class="card loading hidden">EDINET DBから取得しています…</div>

<div id="app" class="hidden">
<section class="card"><div class="head"><div><span id="industry" class="pill">-</span><h2 id="companyName">-</h2><div class="muted" id="codes">-</div></div><div class="price"><div style="font-size:12px;font-weight:800;color:#b8c6d8">現在株価（手入力）</div><div class="price-row"><input id="price" inputmode="decimal" placeholder="例：1800"><button class="btn" type="button" id="priceBtn">再計算</button></div><div class="muted" id="priceNote">株価を入れると現在PER・PBR・配当利回りを計算します。</div><div class="formula"><div class="kpi"><div class="muted">PER</div><div class="v" id="currentPer">-</div></div><div class="kpi"><div class="muted">PBR</div><div class="v" id="currentPbr">-</div></div><div class="kpi"><div class="muted">配当利回り</div><div class="v" id="currentYield">-</div></div></div></div></div></section>
<section class="card summary"><div class="eyebrow">まずここだけ</div><h3>この会社を超簡単に言うと</h3><div id="simpleSummary"></div></section>
<section class="kpis" id="summaryCards"></section>
<section class="card"><div class="eyebrow">数字をグラフで見る</div><h3 class="section-title">分析に必要な指標の推移</h3><div class="muted">取れない数値は推測で埋めず「データ不足」にします。</div><div id="chartGroups"></div></section>
<section class="card"><div class="eyebrow">固定フォーマット</div><h3 class="section-title">11項目でかんたん分析</h3><div id="analysis11"></div></section>
<section class="card"><h3 class="section-title">出典・データ状態</h3><div id="source" class="source"></div></section>
</div>
</div>
<script>
const API_BASE='/api/edinet';
const state={meta:null,company:null,rows:[],ratios:[],merged:[],retrievedAt:null,isBank:false};
const $=id=>document.getElementById(id);
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const percent=v=>{v=num(v);if(v==null)return null;return Math.abs(v)<=2.2?v*100:v};
const median=a=>{a=a.map(num).filter(v=>v!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2};
const yoy=a=>{a=a.map(num).filter(v=>v!=null);if(a.length<2||a.at(-2)===0)return null;return (a.at(-1)-a.at(-2))/Math.abs(a.at(-2))*100};
const change=a=>{a=a.map(num).filter(v=>v!=null);if(a.length<2||a[0]===0)return null;return (a.at(-1)-a[0])/Math.abs(a[0])*100};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showError(m){$('errorBox').textContent=m;$('errorBox').classList.remove('hidden')} function clearError(){$('errorBox').classList.add('hidden')}
function arrays(o,out=[]){if(Array.isArray(o)){out.push(o);for(const x of o)arrays(x,out)}else if(o&&typeof o==='object')for(const v of Object.values(o))arrays(v,out);return out}
function bestArray(o,pred){if(Array.isArray(o))return o;return arrays(o).filter(a=>a.some(pred)).sort((a,b)=>b.length-a.length)[0]||[]}
function fiscal(r){return String(r?.fiscal_year??r?.fiscalYear??r?.year??r?.period??'')}
function field(r,...ks){for(const k of ks)if(r&&r[k]!=null)return r[k];return null}
function deep(o,ks){if(!o||typeof o!=='object')return null;for(const k of ks)if(o[k]!=null)return o[k];for(const v of Object.values(o)){if(v&&typeof v==='object'){const r=deep(v,ks);if(r!=null)return r}}return null}
function fmtMoney(v){v=num(v);if(v==null)return 'データ不足';const s=v<0?'-':'',a=Math.abs(v);if(a>=1e12)return s+(a/1e12).toFixed(2)+'兆円';if(a>=1e8)return s+(a/1e8).toFixed(0)+'億円';return s+a.toLocaleString('ja-JP')+'円'}

(async()=>{try{const r=await fetch(API_BASE+'?action=status');const j=await r.json();$('apiStatus').textContent=j.hasKey?'✅ APIキー設定済み。実データを取得できます。':'⚠️ EDINET_DB_API_KEYがまだ反映されていません。';}catch{$('apiStatus').textContent='⚠️ API接続確認に失敗しました。';}})();

$('searchForm').addEventListener('submit',async e=>{e.preventDefault();clearError();$('results').innerHTML='';const q=$('q').value.trim();if(!q)return;$('apiStatus').textContent='検索中…';try{const r=await fetch(API_BASE+'?action=search&q='+encodeURIComponent(q));const j=await r.json();if(!r.ok)throw new Error(j.error||'検索失敗');let a=bestArray(j.data,x=>x&&typeof x==='object').map(x=>({edinet:String(x.edinet_code??x.edinetCode??x.code??''),stock:String(x.securities_code??x.security_code??x.stock_code??x.ticker??''),name:x.company_name??x.name??x.filer_name??x.companyName??'名称不明',industry:x.industry??x.industry_name??''})).filter(x=>x.edinet.startsWith('E'));if(/^\d{4}$/.test(q)){const ex=a.filter(x=>x.stock.startsWith(q));if(ex.length)a=ex}$('apiStatus').textContent=a.length?`${a.length}件見つかりました。企業をタップしてください。`:'見つかりませんでした。';$('results').innerHTML=a.slice(0,10).map((x,i)=>`<button class="result" style="width:100%;text-align:left;background:#fff" data-i="${i}"><b>${esc(x.name)}</b><span class="muted">${esc(x.stock||'証券コード不明')} / ${esc(x.edinet)} ${esc(x.industry||'')}</span></button>`).join('');[...document.querySelectorAll('.result')].forEach(el=>el.onclick=()=>loadCompany(a[Number(el.dataset.i)]));}catch(err){showError('検索エラー：'+err.message);$('apiStatus').textContent='検索できませんでした。'}});

async function loadCompany(meta){clearError();$('loading').classList.remove('hidden');$('app').classList.add('hidden');try{const r=await fetch(API_BASE+'?action=analyze&code='+encodeURIComponent(meta.edinet));const j=await r.json();if(!r.ok)throw new Error(j.message||j.error||'取得失敗');state.meta=meta;state.company=j.company;state.retrievedAt=j.retrievedAt;state.rows=bestArray(j.financials,x=>x&&typeof x==='object'&&('fiscal_year'in x||'year'in x));state.ratios=bestArray(j.ratios,x=>x&&typeof x==='object'&&('fiscal_year'in x||'year'in x));state.rows.sort((a,b)=>fiscal(a).localeCompare(fiscal(b)));state.ratios.sort((a,b)=>fiscal(a).localeCompare(fiscal(b)));const rm=new Map(state.ratios.map(r=>[fiscal(r),r]));state.merged=state.rows.map(r=>({...r,__ratio:rm.get(fiscal(r))||{}}));const industry=String(meta.industry||deep(j.company,['industry','industry_name'])||'');state.isBank=industry.includes('銀行');render();$('app').classList.remove('hidden');$('app').scrollIntoView({behavior:'smooth',block:'start'});}catch(err){showError('データ取得エラー：'+err.message);}finally{$('loading').classList.add('hidden')}}
function getSeries(keys,src='row'){return state.merged.map(r=>field(src==='ratio'?r.__ratio:r,...keys))}
function metric(title,keys,unit='円',src='row',explain='',chartType='bar'){return {title,vals:getSeries(keys,src),unit,explain,chartType}}
function compactValue(v,unit=''){v=num(v);if(v==null)return '-';const a=Math.abs(v),sgn=v<0?'-':'';let body;if(a>=1e12)body=(a/1e12).toFixed(1)+'兆';else if(a>=1e8)body=(a/1e8).toFixed(0)+'億';else if(a>=1e4)body=(a/1e4).toFixed(0)+'万';else if(a>=100)body=a.toFixed(0);else body=a.toFixed(a<10?2:1);return sgn+body+(unit==='%'?'%':unit==='倍'?'倍':unit==='円'&&a<1e8?'円':'')}
function barChartSvg(vals,unit='円'){const pts=vals.map(num),valid=pts.filter(v=>v!=null);if(valid.length<2)return `<div class="muted" style="padding:42px 0">データ不足</div>`;const W=520,H=185,pX=30,pTop=24,pBottom=30;let min=Math.min(0,...valid),max=Math.max(0,...valid);if(max===min){max+=1;min-=1}const y=v=>pTop+(max-v)/(max-min)*(H-pTop-pBottom);const zeroY=y(0),n=pts.length,gap=14,usable=W-pX*2,barW=Math.max(18,(usable-gap*(n-1))/n);const bars=pts.map((v,i)=>{if(v==null)return '';const yy=y(v),top=Math.min(yy,zeroY),h=Math.max(2,Math.abs(yy-zeroY)),x=pX+i*(barW+gap),isLatest=i===pts.length-1,labelY=v>=0?Math.max(12,top-6):Math.min(H-pBottom-3,top+h+12);return `<rect x="${x}" y="${top}" width="${barW}" height="${h}" rx="5" fill="#0d7c5a" opacity="${isLatest?'1':'0.55'}"/><text x="${x+barW/2}" y="${labelY}" text-anchor="middle" font-size="9" font-weight="${isLatest?'700':'500'}" fill="#526278">${compactValue(v,unit)}</text><text x="${x+barW/2}" y="${H-5}" text-anchor="middle" font-size="10" fill="#738197">${esc(fiscal(state.merged[i]).slice(-4))}</text>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${pX}" x2="${W-pX}" y1="${zeroY}" y2="${zeroY}" stroke="#dce3ea"/>${bars}</svg>`}
function lineChartSvg(vals,unit='',showMedian=false){const pts=vals.map(v=>unit==='%'?percent(v):num(v)),valid=pts.filter(v=>v!=null);if(valid.length<2)return `<div class="muted" style="padding:42px 0">データ不足</div>`;const med=showMedian?median(valid):null;let min=Math.min(...valid,...(med==null?[]:[med])),max=Math.max(...valid,...(med==null?[]:[med]));const pad=Math.max((max-min)*0.22,Math.abs(max)*0.06,0.5);min-=pad;max+=pad;if(max===min){min-=1;max+=1}const W=520,H=205,pX=34,pTop=34,pBottom=34,y=v=>pTop+(max-v)/(max-min)*(H-pTop-pBottom),coords=pts.map((v,i)=>v==null?null:[pX+i*(W-pX*2)/(pts.length-1),y(v)]);let path='';coords.forEach(c=>{if(!c)return;path+=(path?' L ':'M ')+c[0]+','+c[1]});let medianMarkup='';if(med!=null){const my=y(med);medianMarkup=`<line x1="${pX}" x2="${W-pX}" y1="${my}" y2="${my}" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/><text x="${W-pX}" y="${Math.max(12,my-7)}" text-anchor="end" font-size="9" fill="#9a6700">過去中央値 ${compactValue(med,unit)}</text>`}const dots=coords.map((c,i)=>{if(!c)return '';const isLatest=i===coords.length-1;const value=compactValue(pts[i],unit);const labelAbove=i%2===0;const labelY=labelAbove?Math.max(13,c[1]-11):Math.min(H-pBottom-6,c[1]+18);let anchor='middle',labelX=c[0];if(i===0){anchor='start';labelX=Math.max(pX,c[0]-2)}else if(i===coords.length-1){anchor='end';labelX=Math.min(W-pX,c[0]+2)}return `<circle cx="${c[0]}" cy="${c[1]}" r="${isLatest?'5':'4'}" fill="#0d7c5a"/><text x="${labelX}" y="${labelY}" text-anchor="${anchor}" font-size="9.5" font-weight="${isLatest?'700':'600'}" fill="${isLatest?'#0d7c5a':'#526278'}">${value}</text><text x="${c[0]}" y="${H-6}" text-anchor="middle" font-size="10" fill="#738197">${esc(fiscal(state.merged[i]).slice(-4))}</text>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${pX}" x2="${W-pX}" y1="${H-pBottom}" y2="${H-pBottom}" stroke="#e5eaf0"/>${medianMarkup}<path d="${path}" fill="none" stroke="#0d7c5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`}
function chartSvg(m){return m.chartType==='line'?lineChartSvg(m.vals,m.unit,m.title==='PER'||m.title==='PBR'):barChartSvg(m.vals,m.unit)}
function trendComment(m){const v=m.vals.map(num).filter(x=>x!=null);if(v.length<2)return 'データが足りないため傾向は判断しません。';if(m.unit==='%'){const f=percent(v[0]),l=percent(v.at(-1));return `${m.title}は${f.toFixed(1)}% → ${l.toFixed(1)}%。${l>f+1?'改善':'低下または横ばい'}傾向です。${m.explain}`;}const c=change(v),y=yoy(v);if(m.title==='PER'||m.title==='PBR')return `${m.title}は期間の最初より約${Math.abs(c).toFixed(0)}%${c<0?'低い':'高い'}評価です。低い＝即割安ではなく業績とセットで見ます。`;return `${m.title}は期間の最初より約${Math.abs(c).toFixed(0)}%${c>=0?'増加':'減少'}。直近年度は前年比${y==null?'比較不可':(y>=0?'+':'')+y.toFixed(1)+'%'}です。${m.explain}`}
function renderCharts(){const groups=state.isBank?[[ '① 業績',[metric('経常収益',['revenue'],'円','row','','bar'),metric('経常利益',['ordinary_income'],'円','row','','bar'),metric('純利益',['net_income'],'円','row','','bar')]],[ '② 稼ぐ効率',[metric('ROE',['roe'],'%','ratio','株主のお金を使う効率。','line')]],[ '③ 財務規模',[metric('総資産',['total_assets'],'円','row','','bar'),metric('純資産',['net_assets'],'円','row','','bar')]],[ '④ 1株あたり・配当',[metric('EPS',['eps'],'円','row','','bar'),metric('BPS',['bps'],'円','row','','bar'),metric('1株配当',['dividend_per_share'],'円','row','','bar'),metric('配当性向',['payout_ratio'],'%','row','利益のうち何%を配当に回しているか。','line')]],[ '⑤ 市場評価',[metric('PER',['per'],'倍','ratio','','line'),metric('PBR',['pbr'],'倍','ratio','','line')]]]:[[ '① 業績',[metric('売上高',['revenue'],'円','row','','bar'),metric('営業利益',['operating_income'],'円','row','','bar'),metric('純利益',['net_income'],'円','row','','bar')]],[ '② 稼ぐ効率',[metric('営業利益率',['operating_margin'],'%','ratio','100円売って本業利益が何円残るか。','line'),metric('ROE',['roe'],'%','ratio','株主のお金を使う効率。','line')]],[ '③ 財務・現金',[metric('自己資本比率',['equity_ratio'],'%','ratio','会社の体力。','line'),metric('営業CF',['cf_operating'],'円','row','','bar'),metric('純資産',['net_assets'],'円','row','','bar'),metric('総資産',['total_assets'],'円','row','','bar')]],[ '④ 1株あたり・配当',[metric('EPS',['eps'],'円','row','','bar'),metric('BPS',['bps'],'円','row','','bar'),metric('1株配当',['dividend_per_share'],'円','row','','bar'),metric('配当性向',['payout_ratio'],'%','row','利益のうち何%を配当に回しているか。','line')]],[ '⑤ 市場評価',[metric('PER',['per'],'倍','ratio','','line'),metric('PBR',['pbr'],'倍','ratio','','line')]]];$('chartGroups').innerHTML=groups.map(([name,ms])=>{const av=ms.filter(m=>m.vals.filter(v=>num(v)!=null).length>=2);if(!av.length)return '';return `<div class="group"><div class="group-label">${name}</div><div class="charts">${av.map(m=>`<div class="chart"><h4>${m.title}</h4>${chartSvg(m)}<div class="comment"><b>このグラフから分かること：</b>${trendComment(m)}</div></div>`).join('')}</div></div>`}).join('')||'<div class="muted" style="padding:20px 0">グラフ用の時系列データが不足しています。</div>'}
function latest(){return state.merged.at(-1)||{}}
function evaluation(){const rev=getSeries(['revenue']).map(num).filter(v=>v!=null),prof=getSeries(state.isBank?['ordinary_income']:['operating_income']).map(num).filter(v=>v!=null),ry=yoy(rev),py=yoy(prof);return {revY:ry,profitY:py,perf:ry==null?'na':ry>=-5?'good':ry>-15?'mid':'bad',profit:py==null?'na':py>=-5?'good':py>-20?'mid':'bad'}}
function currentVal(){const p=num($('price').value),l=latest(),eps=num(field(l.__ratio,'adjusted_eps')??l.eps),bps=num(field(l.__ratio,'adjusted_bps')??l.bps),dps=num(field(l.__ratio,'adjusted_dividend_per_share')??l.dividend_per_share),pm=median(getSeries(['per'],'ratio')),bm=median(getSeries(['pbr'],'ratio')),per=p&&eps&&eps>0?p/eps:null,pbr=p&&bps&&bps>0?p/bps:null,yld=p&&dps!=null?dps/p*100:null;let judge='株価入力待ち',k='na';if(p&&per!=null&&pbr!=null&&pm&&bm){const pd=(per/pm-1)*100,bd=(pbr/bm-1)*100;if(pd<=-15&&bd<=-15){judge='割安候補';k='good'}else if(pd<=-15||bd<=-15){judge='一部割安';k='mid'}else{judge='過去より安いとは言いにくい';k='mid'}}return {p,eps,bps,dps,per,pbr,yld,pm,bm,judge,k}}
function renderVal(){const v=currentVal();$('currentPer').textContent=v.per!=null?v.per.toFixed(2)+'倍':'-';$('currentPbr').textContent=v.pbr!=null?v.pbr.toFixed(2)+'倍':'-';$('currentYield').textContent=v.yld!=null?v.yld.toFixed(2)+'%':'-';$('priceNote').textContent=v.p?`株価 ${v.p.toLocaleString()}円 / EPS ${v.eps??'不明'} / BPS ${v.bps??'不明'} / 過去中央値 PER ${v.pm?.toFixed(2)??'-'}・PBR ${v.bm?.toFixed(2)??'-'}`:'株価を入れると現在PER・PBR・配当利回りを計算します。';renderCards();render11()}
function renderCards(){const e=evaluation(),v=currentVal(),c=(n,k,t)=>`<div class="kpi"><div class="muted">${n}</div><div class="v ${k}">${t}</div></div>`;$('summaryCards').innerHTML=c('売上',e.perf,e.perf==='good'?'🟢 良好':e.perf==='bad'?'🔴 注意':e.perf==='mid'?'🟡 要確認':'⚪ 不足')+c('利益',e.profit,e.profit==='good'?'🟢 良好':e.profit==='bad'?'🔴 注意':e.profit==='mid'?'🟡 要確認':'⚪ 不足')+c('割安度',v.k,v.p?(v.k==='good'?'🟢 ':'🟡 ')+v.judge:'⚪ 株価入力待ち')+c('業種',state.isBank?'mid':'good',state.isBank?'🏦 銀行モード':'🏢 一般企業')+c('データ年数','na',state.merged.length+'年')+c('判定方法','na','数値ルール')}
function render11(){const e=evaluation(),v=currentVal(),l=latest(),roe=percent(field(l.__ratio,'roe')),eq=percent(field(l.__ratio,'equity_ratio')??l.equity_ratio),cf=num(l.cf_operating),dps=num(field(l.__ratio,'adjusted_dividend_per_share')??l.dividend_per_share),po=percent(l.payout_ratio),business=deep(state.company,['business_summary','businessSummary','business_description'])||`${state.meta.industry||'上場企業'}として事業を行っています。`;const rows=[['何で稼いでいる会社か','na',business],[state.isBank?'経常収益は伸びているか':'売上は伸びているか',e.perf,e.revY==null?'データ不足':`前年比 ${e.revY>=0?'+':''}${e.revY.toFixed(1)}%`],[state.isBank?'利益は伸びているか':'本業の利益は伸びているか',e.profit,e.profitY==null?'データ不足':`前年比 ${e.profitY>=0?'+':''}${e.profitY.toFixed(1)}%`],['稼ぐ効率は悪化していないか',roe==null?'na':roe>=8?'good':'mid',roe==null?'ROEデータ不足':`最新ROE ${roe.toFixed(1)}%。株主のお金100円で約${roe.toFixed(0)}円の利益を作るイメージ。`],['財務は危なくないか',state.isBank?'mid':eq==null?'na':eq>=40?'good':eq>=20?'mid':'bad',state.isBank?'銀行はCET1比率など銀行専用指標を公式IRで確認します。':eq==null?'自己資本比率データ不足':`自己資本比率 ${eq.toFixed(1)}%。`],['本業で現金を稼げているか',state.isBank?'na':cf==null?'na':cf>0?'good':'bad',state.isBank?'銀行は営業CFを普通の会社と同じように評価しません。':cf==null?'営業CFデータ不足':`営業CF ${fmtMoney(cf)}。`],['PER・PBRは過去より高いか安いか',v.k,v.p?`現在PER ${v.per?.toFixed(2)??'-'}倍 / 過去中央値 ${v.pm?.toFixed(2)??'-'}倍。現在PBR ${v.pbr?.toFixed(2)??'-'}倍 / 過去中央値 ${v.bm?.toFixed(2)??'-'}倍。→ ${v.judge}`:'現在株価を入力すると判定できます。'],['配当は無理していないか',dps==null?'na':po!=null&&po>80?'mid':'good',`1株配当 ${dps!=null?dps+'円':'データ不足'}。${po!=null?'配当性向 '+po.toFixed(1)+'%。':'配当性向はデータ不足。'}`],['業績全体はどうか',e.perf==='good'&&e.profit==='good'?'good':'mid','売上・利益・効率・財務・市場評価をまとめて見ます。'],['この会社を見る理由',e.perf==='good'||e.profit==='good'?'good':'mid',`${e.perf==='good'?'売上が大きく崩れていません。':''}${e.profit==='good'?' 利益も直近では悪化していません。':''}${v.k==='good'?' さらにPER/PBRが過去より低く、割安候補です。':''}`||'追加確認が必要です。'],['注意する理由','mid',state.isBank?'金利・貸倒れ・CET1比率・業務純益など銀行特有の数字は公式IRで確認が必要です。':'PER/PBRが低いだけでは買いません。下方修正・減配・利益率悪化など「安い理由」を確認します。']];$('analysis11').innerHTML=rows.map((r,i)=>`<div class="analysis-row"><div class="n">${i+1}</div><div><h4>${r[0]}</h4><div class="status ${r[1]}">${r[1]==='good'?'🟢 良好':r[1]==='bad'?'🔴 注意':r[1]==='mid'?'🟡 要確認':'⚪ 説明'}</div><div class="detail">${r[2]}</div>${i===6?'<div class="help"><b>PER：</b>利益への市場評価　<b>PBR：</b>純資産への市場評価。低いだけで割安確定ではありません。</div>':''}</div></div>`).join('')}
function render(){const m=state.meta;$('companyName').textContent=m.name;$('industry').textContent=m.industry||'業種不明';$('codes').textContent=`証券コード ${m.stock||'-'} / EDINET ${m.edinet}`;const summary=deep(state.company,['business_summary','businessSummary','business_description'])||`${m.industry||'上場企業'}の会社です。`;$('simpleSummary').innerHTML=`<p>${esc(summary)}</p><p>${state.isBank?'銀行モードで見ます。一般企業の営業利益率や営業CFは重視しません。':'売上 → 本業利益 → 稼ぐ効率 → 財務 → 現金 → PER/PBR → 配当の順に見ます。'}</p>`;renderCharts();renderVal();$('source').innerHTML=`出典：EDINET DB REST API<br>取得日時：${new Date(state.retrievedAt).toLocaleString('ja-JP')}<br>対象：直近最大6年<br><span class="muted">取得できない数値は推測で補完していません。現在PER/PBRは入力株価と最新EPS/BPSから計算します。</span>`}
$('priceBtn').onclick=renderVal;$('price').addEventListener('input',renderVal);
</script>
